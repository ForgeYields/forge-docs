<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888780"></path>
    </marker>
  </defs>

  <!-- stage: inputs -->
  <text x="16" y="18" font-size="11" font-weight="500" fill="#888780">Inputs</text>

  <rect x="16" y="28" width="150" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"></rect>
  <text x="91" y="49" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Hallmark scores</text>
  <text x="91" y="68" text-anchor="middle" font-size="12" fill="#0F6E56">open protocol · 15 min</text>

  <rect x="182" y="28" width="150" height="52" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"></rect>
  <text x="257" y="49" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Allocator Policy</text>
  <text x="257" y="68" text-anchor="middle" font-size="12" fill="#534AB7">verdicts &amp; limits</text>

  <rect x="348" y="28" width="150" height="52" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"></rect>
  <text x="423" y="49" text-anchor="middle" font-size="14" font-weight="500" fill="#43423E">Epoch net flows</text>
  <text x="423" y="68" text-anchor="middle" font-size="12" fill="#5F5E5A">protocol clearing</text>

  <rect x="514" y="28" width="150" height="52" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"></rect>
  <text x="589" y="49" text-anchor="middle" font-size="14" font-weight="500" fill="#43423E">Live monitoring</text>
  <text x="589" y="68" text-anchor="middle" font-size="12" fill="#5F5E5A">Hypernative alerts</text>

  <!-- bus -->
  <line x1="91" y1="80" x2="91" y2="104" stroke="#888780" stroke-width="1.25"></line>
  <line x1="257" y1="80" x2="257" y2="104" stroke="#888780" stroke-width="1.25"></line>
  <line x1="423" y1="80" x2="423" y2="104" stroke="#888780" stroke-width="1.25"></line>
  <line x1="589" y1="80" x2="589" y2="104" stroke="#888780" stroke-width="1.25"></line>
  <line x1="91" y1="104" x2="589" y2="104" stroke="#888780" stroke-width="1.25"></line>
  <line x1="340" y1="104" x2="340" y2="136" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"></line>

  <!-- stage: decision -->
  <text x="16" y="134" font-size="11" font-weight="500" fill="#888780">Decision</text>

  <rect x="190" y="140" width="300" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"></rect>
  <text x="340" y="160" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Target allocation</text>
  <text x="340" y="178" text-anchor="middle" font-size="12" fill="#534AB7">excluded = 0 · weights &#8804; caps</text>

  <rect x="530" y="142" width="134" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"></rect>
  <text x="597" y="160" text-anchor="middle" font-size="14" font-weight="500" fill="#43423E">Optimizer</text>
  <text x="597" y="177" text-anchor="middle" font-size="12" fill="#5F5E5A">roadmap</text>
  <line x1="530" y1="164" x2="496" y2="164" stroke="#888780" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arr)"></line>

  <line x1="340" y1="188" x2="340" y2="208" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"></line>

  <rect x="190" y="212" width="300" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"></rect>
  <text x="340" y="230" text-anchor="middle" font-size="14" font-weight="500" fill="#43423E">Risk committee</text>
  <text x="340" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">approves targets</text>

  <line x1="340" y1="256" x2="340" y2="276" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"></line>

  <!-- stage: execution -->
  <text x="16" y="274" font-size="11" font-weight="500" fill="#888780">Execution</text>

  <rect x="190" y="280" width="300" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"></rect>
  <text x="340" y="298" text-anchor="middle" font-size="14" font-weight="500" fill="#43423E">Batch construction</text>
  <text x="340" y="315" text-anchor="middle" font-size="12" fill="#5F5E5A">crash-safe pipeline</text>

  <line x1="340" y1="324" x2="340" y2="344" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"></line>

  <rect x="190" y="348" width="300" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"></rect>
  <text x="340" y="366" text-anchor="middle" font-size="14" font-weight="500" fill="#43423E">On-chain execution</text>
  <text x="340" y="383" text-anchor="middle" font-size="12" fill="#5F5E5A">slippage bounds · whitelist</text>

  <line x1="340" y1="392" x2="340" y2="410" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"></line>

  <!-- stage: record -->
  <text x="16" y="408" font-size="11" font-weight="500" fill="#888780">Record</text>

  <rect x="190" y="414" width="300" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"></rect>
  <text x="340" y="434" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Atomic Transparency Ledger</text>
  <text x="340" y="452" text-anchor="middle" font-size="12" fill="#0F6E56">policy rationale per movement</text>

  <!-- continuous monitoring return -->
  <path d="M 490 438 L 670 438 L 670 54 L 668 54" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"></path>
  <text x="662" y="260" font-size="11" fill="#888780" transform="rotate(-90 662 260)" text-anchor="middle">continuous monitoring</text>

  <!-- flows annotation -->
  <line x1="508" y1="296" x2="494" y2="190" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"></line>
  <text x="508" y="310" font-size="11" fill="#5F5E5A">inflows &#8594; idle ·</text>
  <text x="508" y="325" font-size="11" fill="#5F5E5A">outflows &#8594; redemption</text>
  <text x="508" y="340" font-size="11" fill="#5F5E5A">sleeve — both ordinary</text>
  <text x="508" y="355" font-size="11" fill="#5F5E5A">allocation targets</text>
</svg>
